<div id="homePage"
     ng-controller="HomeCtrl as home"
     data-ng-init="initHome()">
  <!-- before signing in -->
  <div class="container-fluid"
       ng-if="!ticket">
    <div class="row login align-items-center">
      <div class="col-lg-6 d-none d-lg-block login-illustration login-bottom-padding align-self-stretch">
        <div class="row align-items-center h-100">
          <div class="col">
            <img src="../../assets/images/home.svg"
                 class="img-fluid"
                 alt="grep your data and create pivot charts" />
          </div>
        </div>
      </div>
      <div class="col-xxl-4 col-xl-5 col-lg-6 login-bottom-padding">
        <div class="px-5">
          <h1 class="mb-3">
            Login
          </h1>
          <p>
            Start your analytics journey by signing in.
          </p>
          <form class="mt-4 mb-5">
            <div class="row" ng-show="loginParams.errorText">
              <div class="col-12">
                <div class="alert alert-danger ng-binding" role="alert">

                </div>
              </div>
            </div>
            <label for="userName" class="form-label">
              Username
            </label>
            <input placeholder="Enter username"
                   type="text"
                   class="form-control mb-3"
                   id="userName"
                   required=""
                   ng-disabled="SigningIn"
                   ng-enter="login()"
                   ng-keypress="loginParams.errorText = ''"
                   ng-model="loginParams.userName">
            <label for="password" class="form-label">
              Password
            </label>
            <input placeholder="Enter password"
                   type="password"
                   class="form-control mb-4"
                   id="password"
                   required=""
                   ng-disabled="SigningIn"
                   ng-enter="login()"
                   ng-keypress="loginParams.errorText = ''"
                   ng-model="loginParams.password">
            <button type="button"
                    class="btn btn-primary"
                    ng-click="login()">
              Login
            </button>
          </form>
          <hr>
          <p>Forgot your username or password? Please contact your admin.</p>
        </div>
      </div>
    </div>
  </div>
  <!-- after signing in -->
  <div class="container"
       ng-if="ticket">
    <div class="row">
    <div class="home-body-text text-center col-12">
      <div class="home-start">
        <h1 class="mb-3" id="welcome">
          Welcome to Teragrep
        </h1>
        <!-- Search notebooks by their name -->
        <div class="filter-names">
          <form class="text-start mb-3">
        <span class="form-control-search">
          <i class="fas fa-magnifying-glass"></i>
        </span>
            <input type="text"
                   class="note-name-query form-control form-control-lg"
                   ng-click="$event.stopPropagation()"
                   placeholder="Search for a notebook"
                   ng-model="$parent.query.q"
                   ng-model-options="{ updateOn: 'default blur', debounce: { 'default': 300, 'blur': 0 } }" />
          </form>
        </div>
        <!-- Import and create notebooks -->
        <div class="mb-5 d-grid gap-2 d-lg-block">
          <button class="btn btn-lg btn-primary me-lg-2"
                  ng-click="createNote()">
            <i class="fa-solid fa-file-circle-plus me-2"></i>
            New notebook
          </button>
          <button class="btn btn-lg btn-secondary"
                  ng-click="openImportModal()">
            <i class="fas fa-upload me-2"></i>
            Import notebook
          </button>
        </div>
      </div>
      <!-- List of existing notebooks -->
      <div id="notebook-names" class="notebook-list">
        <ul>
          <li ng-repeat="note in home.notes.list | filter:query.q track by $index">
            <i class="icon-doc"></i>
            <a href="#/notebook/{{note.id}}">
              {{noteName(note)}}
            </a>
          </li>
        </ul>
        <ul class="list-unstyled" ng-if="!query.q || query.q === ''">
          <li ng-repeat="node in home.notes.root.children"
              ng-include src="'/app/home/notebook-template.html'"
              ng-class="note_folder_renderer">
          </li>
        </ul>
        <!-- Shows filter search results -->
        <ul class="list-unstyled" ng-if="query.q">
          <li ng-repeat="node in home.notes.flatList | filter:query.q | orderBy:home.arrayOrderingSrv.noteFlatListOrdering"
              ng-include src="'/app/home/notebook-template.html'"
              ng-class="note_folder_renderer"></li>
        </ul>
      </div>
    </div>
  </div>
  </div>

  <!-- Load notebook -->
  <div ng-show="home.notebookHome" id="{{currentParagraph.id}}_paragraphColumn_main"
       ng-repeat="currentParagraph in home.note.paragraphs"
       ng-controller="ParagraphCtrl"
       ng-init="init(currentParagraph, home.note)"
       ng-class="columnWidthClass(currentParagraph.config.colWidth)"
       class="m-0 p-0">
    <div id="{{currentParagraph.id}}_paragraphColumn"
         ng-if="currentParagraph.results"
         ng-include src="'/app/notebook/paragraph/paragraph.html'"
         ng-class="{'paragraph-space box paragraph-margin': !asIframe, 'focused': paragraphFocused}"
         ng-hide="currentParagraph.config.tableHide && home.viewOnly">
    </div>
  </div>
</div>
